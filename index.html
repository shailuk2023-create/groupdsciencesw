    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);

            --dark-bg: #0f0f23;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #e0e0e0;
            --accent: #ff6b6b;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .navbar {
            background: rgba(15, 15, 35, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar {
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            height: calc(100vh - 76px);
        }
        .sidebar .nav-link {
            color: var(--text-light);
            border-radius: 15px;
            margin: 5px 10px;
            padding: 12px 20px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            text-decoration: none;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: var(--secondary-gradient);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }
        .card:hover {
            transform: translateY(-15px) rotateX(5deg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .card-header {
            background: var(--primary-gradient);
            color: white;
            font-weight: 600;
            padding: 15px 20px;
        }
        .card-body {
            padding: 20px;
        }
        .player-container {
            background: #000;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .speed-control {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .speed-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            margin: 0 10px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .btn-premium {
            background: var(--secondary-gradient);
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
        }
        .btn-premium:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-download {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
            border: none;
            border-radius: 25px;
            padding: 8px 16px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-download:hover {
            transform: scale(1.1);
            color: white;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }
        .pdf-viewer {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: white;
        }
        #content {
            animation: slideInUp 0.6s ease-out;
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .lecture-card {
            position: relative;
            overflow: hidden;
        }
        .lecture-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--secondary-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .lecture-card:hover::before {
            transform: scaleX(1);
        }
        .icon-bg {
            background: var(--primary-gradient);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

                {id: 1, title: 'Unit and Dimension (मात्रक और विमाएँ)', video: 'hls', url: 'https://d14p19xhs3k7tf.cloudfront.net/561/690b67b3f48d1caffd4d3b18/playlist-mpl-vod.m3u8', pdf: 'https://selectionway-server.s3.ap-south-1.amazonaws.com/pdfs/files/1762415080848-Unit_and_Dimension_class_-01_pdf_RE.pdf'},
                {id: 2, title: 'Light: Reflection and Refraction (परावर्तन और अपवर्तन)', video: 'youtube', url: 'https://www.youtube.com/watch?v=uwqGQh93hZU', pdf: 'https://selectionway-server.s3.ap-south-1.amazonaws.com/pdfs/files/1762572401913-Light_pdf_01_re.pdf'},
                {id: 3, title: 'Reflection of light and lens (प्रकाश का परावर्तन एवं लेंस)', video: 'hls', url: 'https://d14p19xhs3k7tf.cloudfront.net/561/690eb66af48d1caffd9632e7/playlist-mpl-vod.m3u8', pdf: null}
            ]
        };

        function loadSubject(event, subject) {
            if (event) event.preventDefault();
            currentSubject = subject;
            const data = subjects[subject];
            if (!data) {
                document.getElementById('content').innerHTML = '<div class="alert alert-danger">Subject not found!</div>';
                return;
            }
            let html = `<div class="card-header mb-4">
                            <h2 class="mb-0"><i class="fas fa-${subject === 'biology' ? 'dna' : subject === 'chemistry' ? 'flask' : 'bolt'} me-2"></i>${subject.charAt(0).toUpperCase() + subject.slice(1)} Lectures</h2>
                        </div>
                        <div class="row">`;
            data.forEach(lec => {
                const icon = subject === 'biology' ? 'fa-heartbeat' : subject === 'chemistry' ? 'fa-vial' : 'fa-magnet';
                html += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card lecture-card animate__animated animate__fadeInUp" style="animation-delay: ${Math.random() * 0.3}s;">
                            <div class="icon-bg text-white mb-3">
                                <i class="fas ${icon} fa-2x"></i>
                            </div>
                            <div class="card-body text-center">
                                <h5 class="card-title text-light">Class ${lec.id}: ${lec.title}</h5>
                                <div class="d-flex justify-content-center gap-2 flex-wrap">
                                    <button class="btn-premium me-2" onclick="playVideo('${lec.video}', '${lec.url}')">
                                        <i class="fas fa-play me-1"></i>Play
                                    </button>
                                    ${lec.video === 'youtube' ? '' : `<a href="${lec.url}" class="btn-download" download><i class="fas fa-download me-1"></i>Download Video</a>`}
                                    ${lec.pdf ? `<a href="${lec.pdf}" class="btn-download" download><i class="fas fa-file-pdf me-1"></i>Download PDF</a>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
        }

        function playVideo(type, url) {
            let playerHtml;
            let downloadBtn = '';
            if (type === 'youtube') {
                const embedUrl = url.replace('watch?v=', 'embed/') + '?enablejsapi=1&rel=0';
                playerHtml = `<iframe class="w-100 rounded" height="500" src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
                              <div class="alert alert-warning mt-3">YouTube videos: Use browser extensions for download. Speed up to 2x via player controls.</div>`;
            } else {
                downloadBtn = `<a href="${url}" class="btn-download ms-2" download><i class="fas fa-download me-1"></i>Download</a>`;
                playerHtml = `
                    <video id="my-video" class="video-js vjs-big-play-centered vjs-default-skin rounded" controls preload="auto" width="100%" height="500" data-setup='{"fluid": true}'>
                        <source src="${url}" type="application/x-mpegURL">
                        <p class="vjs-no-js">To view this video, enable JavaScript and consider upgrading to a web browser that supports HTML5 video.</p>
                    </video>
                    <div class="speed-control">
                        <label class="form-label mb-0 me-2">Speed:</label>
                        <span id="speedValue" class="me-2">1.0x</span>
                        <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="3" step="0.1" value="1" oninput="updateSpeed()">
                        ${downloadBtn}
                    </div>
                `;
            }
            document.getElementById('content').innerHTML = `
                <div class="card player-container animate__animated animate__zoomIn">
                    <div class="card-body p-0">
                        ${playerHtml}
                        <button class="btn-premium mt-3" onclick="loadSubject(null, '${currentSubject}')">
                            <i class="fas fa-arrow-left me-2"></i>Back to Lectures
                        </button>
                    </div>
                </div>
            `;
            if (type !== 'youtube') {
                setTimeout(() => {
                    if (currentPlayer) currentPlayer.dispose();
                    currentPlayer = videojs('my-video', {
                        fluid: true,
                        playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3]
                    });
                    updateSpeed(); // Initial set
                }, 500);
            }
        }

        function updateSpeed() {
            const slider = document.getElementById('speedSlider');
            let value = parseFloat(slider.value);
            // Remove extra zeros/decimals
            if (value % 1 === 0) {
                value = Math.floor(value);
            } else {
                value = value.toFixed(1);
            }
            document.getElementById('speedValue').textContent = value + 'x';
            if (currentPlayer) {
                currentPlayer.playbackRate(slider.value);
            }
        }

        // Initialize
        loadSubject(null, 'biology');
    </script>
</body>
</html>
